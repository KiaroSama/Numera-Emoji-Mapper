[package]
name = "numera-test-inventory"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[dependencies]
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
quote = "=1.0.47"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.2"
syn = { version = "=3.0.10", features = ["full", "visit"] }
toml-span = "=0.7.2"

[dev-dependencies]
ctor = { version = "=1.0.14", default-features = false, features = ["proc_macro"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "=0.2.191"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_System_Environment", "Win32_System_Console", "Win32_UI_Shell"] }
