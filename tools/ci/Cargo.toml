[package]
name = "numera-ci"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[dependencies]
flate2 = "=1.1.11"
libc = "=0.2.191"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.2"
tar = "=0.4.46"
tempfile = "=3.27.0"

[dev-dependencies]
ctor = { version = "=1.0.14", default-features = false, features = ["proc_macro"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_System_Environment", "Win32_System_Console", "Win32_UI_Shell"] }
