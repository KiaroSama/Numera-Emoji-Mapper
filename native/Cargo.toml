[package]
name = "numera-emoji-core"
version = "2.0.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "=0.29.3", features = ["abi3-py311"] }

[profile.release]
lto = "thin"
codegen-units = 1
