name: Gitleaks

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
  schedule:
    - cron: '21 4 * * 4'

permissions:
  contents: read

env:
  NUMERA_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: gitleaks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-tool-tests:
    name: Rust security tooling tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Protect scan diagnostics
        shell: bash
        run: |
          if [[ "${RUNNER_DEBUG:-0}" == "1" ]]; then
            echo '[ERROR] Disable Actions step debug logging before scanning; checkout debug output can disclose commit contents.' >&2
            exit 1
          fi
          echo '[INFO] Diagnostic privacy guard passed.'
      - name: Check out the complete Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record and verify tested source revision
        shell: bash
        run: |
          mkdir -p logs/checkpoint
          git rev-parse HEAD > logs/checkpoint/source-revision.log
          test "$(cat logs/checkpoint/source-revision.log)" = "$NUMERA_SOURCE_REVISION"
      - name: Select supported Rust compiler
        run: |
          rustup default 1.100.0
          rustup component add rustfmt clippy --toolchain 1.100.0

      - name: Format and lint security tooling
        run: |
          cargo fmt --manifest-path tools/ci/Cargo.toml --check
          cargo clippy --manifest-path tools/ci/Cargo.toml --locked --all-targets -- -D warnings
      - name: Build the isolated test runner
        run: cargo build --manifest-path runtime/Cargo.toml --locked --release --bin numera-runtime-tests
      - name: Permit private security-test namespaces
        uses: ./.github/actions/test-network
      - name: Rust security tooling behavior tests
        run: cargo test --config .cargo/runtime-tests.toml --manifest-path tools/ci/Cargo.toml --locked

  gitleaks:
    name: Gitleaks secret scan
    needs: security-tool-tests
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Protect scan diagnostics
        shell: bash
        run: |
          if [[ "${RUNNER_DEBUG:-0}" == "1" ]]; then
            echo '[ERROR] Disable Actions step debug logging before scanning; checkout debug output can disclose commit contents.' >&2
            exit 1
          fi
          echo '[INFO] Diagnostic privacy guard passed.'
      - name: Check out the complete Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record and verify scanned source revision
        shell: bash
        run: |
          mkdir -p logs/checkpoint
          git rev-parse HEAD > logs/checkpoint/source-revision.log
          test "$(cat logs/checkpoint/source-revision.log)" = "$NUMERA_SOURCE_REVISION"
      - name: Select supported Rust compiler
        run: |
          rustup default 1.100.0
          rustup component add rustfmt clippy --toolchain 1.100.0

      # Scanner orchestration, private output capture, metadata-only summaries,
      # and exact Git-proven historical triage are implemented in Rust.
      - name: Scan Git history with the verified Gitleaks CLI
        run: cargo run --manifest-path tools/ci/Cargo.toml --locked --bin gitleaks
