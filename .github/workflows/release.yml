name: Prebuilt packages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NUMERA_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: prebuilt-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Full CI acceptance before signing
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    uses: ./.github/workflows/ci.yml
    with:
      release_acceptance: true

  secret-acceptance:
    name: Secret-scan acceptance before signing
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    uses: ./.github/workflows/gitleaks.yml
    with:
      release_acceptance: true

  package:
    name: Standalone package ${{ matrix.platform }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: windows-x64
            triple: x86_64-pc-windows-msvc
          - os: windows-11-arm
            platform: windows-arm64
            triple: aarch64-pc-windows-msvc
          - os: ubuntu-24.04
            platform: linux-x64
            triple: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            triple: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record and verify tested source revision
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p logs/checkpoint
          git rev-parse HEAD > logs/checkpoint/source-revision.log
          test "$(cat logs/checkpoint/source-revision.log)" = "$NUMERA_SOURCE_REVISION"
      - name: Select supported Rust toolchain
        shell: bash
        run: |
          rustup default 1.100.0
          host="$(rustc -vV | awk '/^host: / {print $2}')"
          test "$host" = "${{ matrix.triple }}"
      - name: Build standalone production runtime
        run: cargo build --manifest-path runtime/Cargo.toml --locked --release --bins
      - name: Verify embedded logo and target architecture on built binaries
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then suffix=.exe; else suffix=; fi
          for bin in numera-emoji numera-dev numera-runtime-tests numera-worker-admin; do
            "runtime/target/release/numera-emoji$suffix" verify-binary \
              --executable "runtime/target/release/${bin}${suffix}" \
              --target "${{ matrix.platform }}" \
              --logo assets/numera-emoji-mapper-logo-circle.png
          done
      - name: Verify Windows binary version metadata
        if: runner.os == 'Windows'
        uses: ./.github/actions/windows-binary-versions
      - name: Permit private runtime test namespaces
        if: runner.os == 'Linux'
        uses: ./.github/actions/test-network
      # The smoke extracts and installs the actual release executable outside
      # the source fixture, deletes the source, clears PATH and runs PNG conversion.
      - name: Offline package integrity, replacement and native conversion
        shell: bash
        run: |
          mkdir -p logs/checkpoint
          cargo test --config .cargo/runtime-tests.toml --manifest-path runtime/Cargo.toml --locked --release --test standalone_package -- --test-threads=1 2>&1 | tee logs/checkpoint/package-tests.log
      - name: Create standalone archive and SHA256 checksum
        id: standalone-package
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then suffix=.exe; else suffix=; fi
          "runtime/target/release/numera-emoji$suffix" package-native --executable "runtime/target/release/numera-emoji$suffix" --target "${{ matrix.platform }}" --revision "$NUMERA_SOURCE_REVISION" --out dist
      - name: Upload ready downloads and checksums
        if: ${{ always() && steps.standalone-package.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: numera-emoji-mapper-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload compiled binary for signing
        if: ${{ always() && steps.standalone-package.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: numera-emoji-bin-${{ matrix.platform }}
          path: |
            runtime/target/release/numera-emoji
            runtime/target/release/numera-emoji.exe
          if-no-files-found: error
          retention-days: 7

      - name: Preserve CI diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: standalone-package-diagnostics-${{ matrix.platform }}
          path: |
            logs/**/*.log
            logs/tmp/runtime-tests-*/stdout
            logs/tmp/runtime-tests-*/stderr
          if-no-files-found: warn
          retention-days: 7

  signing:
    name: Sign standalone package ${{ matrix.platform }}
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [package, acceptance, secret-acceptance]
    environment: numera-signing
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-24.04
          - platform: linux-arm64
            os: ubuntu-24.04-arm
          - platform: windows-x64
            os: windows-2025
          - platform: windows-arm64
            os: windows-11-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: numera-emoji-bin-${{ matrix.platform }}
          path: bin
      - name: Sign binary, package signed archive, and verify tamper rejection
        shell: bash
        env:
          NUMERA_SIGNING_PFX_BASE64: ${{ secrets.NUMERA_SIGNING_PFX_BASE64 }}
          NUMERA_SIGNING_PASSWORD: ${{ secrets.NUMERA_SIGNING_PASSWORD }}
        run: |
          test -n "$NUMERA_SIGNING_PFX_BASE64"
          test -n "$NUMERA_SIGNING_PASSWORD"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          pfx="$work/signing.pfx"
          key="$work/signing.key.pem"
          pub="$work/publisher-key.pem"
          printf '%s' "$NUMERA_SIGNING_PFX_BASE64" | base64 -d > "$pfx"
          chmod 600 "$pfx"
          openssl pkcs12 -in "$pfx" -nocerts -nodes -passin env:NUMERA_SIGNING_PASSWORD -out "$key"
          chmod 600 "$key"
          awk '/"public_key_pem":/ { sub(/^.*"public_key_pem":[[:space:]]*"/, ""); sub(/",?[[:space:]]*$/, ""); gsub(/\\n/, "\n"); print }' docs/signing/publisher.json > "$pub"
          thumb="$(awk -F'"' '/"certificate_thumbprint":/ { print $4; exit }' docs/signing/publisher.json)"
          test -n "$thumb"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            exe="bin/numera-emoji.exe"
            if [[ "${{ matrix.platform }}" == "windows-arm64" ]]; then
              st="$(ls -1 "/c/Program Files (x86)/Windows Kits/10/bin/"*/arm64/signtool.exe "/c/Program Files (x86)/Windows Kits/10/bin/"*/x64/signtool.exe 2>/dev/null | sort -V | tail -n 1)"
            else
              st="$(ls -1 "/c/Program Files (x86)/Windows Kits/10/bin/"*/x64/signtool.exe 2>/dev/null | sort -V | tail -n 1)"
            fi
            test -x "$st"
            pfx_win="$(cygpath -w "$pfx")"
            exe_win="$(cygpath -w "$exe")"
            "$st" sign //fd SHA256 //f "$pfx_win" //p "$NUMERA_SIGNING_PASSWORD" //tr http://timestamp.digicert.com //td SHA256 "$exe_win"
            "$st" verify //pa //v "$exe_win" > "$work/verify.txt" 2>&1 || true
            grep -qi "SHA1 hash: $thumb" "$work/verify.txt"
            grep -qi "The signature is timestamped:" "$work/verify.txt"
            if grep -qiE "did not verify|File not valid|No signature found" "$work/verify.txt"; then
              cat "$work/verify.txt" >&2
              exit 1
            fi
            cp "$exe" "$work/tampered.exe"
            printf 'X' >> "$work/tampered.exe"
            "$st" verify //pa //v "$(cygpath -w "$work/tampered.exe")" > "$work/tamper.txt" 2>&1 || true
            grep -qiE "did not verify|File not valid|No signature found" "$work/tamper.txt"
            if grep -qi "SHA1 hash: $thumb" "$work/tamper.txt"; then
              echo "Tamper rejection failed for $exe" >&2
              exit 1
            fi
          else
            exe="bin/numera-emoji"
            chmod +x "$exe"
          fi
          "$exe" verify-binary --executable "$exe" --target "${{ matrix.platform }}" --logo assets/numera-emoji-mapper-logo-circle.png
          "$exe" package-native --executable "$exe" --target "${{ matrix.platform }}" --revision "$NUMERA_SOURCE_REVISION" --out dist
          archive="$(ls -1 dist/numera-emoji-mapper-*.zip | head -n 1)"
          test -f "$archive"
          openssl dgst -sha256 -sign "$key" -out "${archive}.sig" "$archive"
          openssl dgst -sha256 -verify "$pub" -signature "${archive}.sig" "$archive"
          cp "$archive" "$work/tampered.zip"
          printf 'X' >> "$work/tampered.zip"
          if openssl dgst -sha256 -verify "$pub" -signature "${archive}.sig" "$work/tampered.zip" >/dev/null 2>&1; then
            echo "Tamper rejection failed for ${archive}" >&2
            exit 1
          fi
      - name: Verify signed Windows binary version metadata
        if: runner.os == 'Windows'
        uses: ./.github/actions/windows-binary-versions
        with:
          executable-path: bin/numera-emoji.exe
          verifier-path: bin/numera-emoji.exe
      - name: Upload signed standalone archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: numera-emoji-mapper-signed-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.sha256
            dist/*.sig
          if-no-files-found: error
          retention-days: 30

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: signing
    environment: numera-signing
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify tag matches Cargo version
        shell: bash
        run: |
          cargo_version="$(awk -F '"' '/^version = / {print $2; exit}' runtime/Cargo.toml)"
          test "$GITHUB_REF_NAME" = "v${cargo_version}"
      - uses: actions/download-artifact@v8
        with:
          pattern: numera-emoji-mapper-signed-*
          path: dist
          merge-multiple: true
      - name: Verify all four signed archives, sign SHA256SUMS, and export public key
        shell: bash
        env:
          NUMERA_SIGNING_PFX_BASE64: ${{ secrets.NUMERA_SIGNING_PFX_BASE64 }}
          NUMERA_SIGNING_PASSWORD: ${{ secrets.NUMERA_SIGNING_PASSWORD }}
        run: |
          test -n "$NUMERA_SIGNING_PFX_BASE64"
          test -n "$NUMERA_SIGNING_PASSWORD"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          pfx="$work/signing.pfx"
          key="$work/signing.key.pem"
          printf '%s' "$NUMERA_SIGNING_PFX_BASE64" | base64 -d > "$pfx"
          chmod 600 "$pfx"
          openssl pkcs12 -in "$pfx" -nocerts -nodes -passin env:NUMERA_SIGNING_PASSWORD -out "$key"
          chmod 600 "$key"
          awk '/"certificate_pem":/ { sub(/^.*"certificate_pem":[[:space:]]*"/, ""); sub(/",?[[:space:]]*$/, ""); gsub(/\\n/, "\n"); print }' docs/signing/publisher.json > dist/publisher-cert.pem
          awk '/"public_key_pem":/ { sub(/^.*"public_key_pem":[[:space:]]*"/, ""); sub(/",?[[:space:]]*$/, ""); gsub(/\\n/, "\n"); print }' docs/signing/publisher.json > dist/publisher-key.pem
          cd dist
          count="$(ls -1 numera-emoji-mapper-*.zip | wc -l | tr -d ' ')"
          test "$count" -eq 4
          for target in linux-x64 linux-arm64 windows-x64 windows-arm64; do
            zip_file="numera-emoji-mapper-${GITHUB_REF_NAME#v}-${target}.zip"
            test -f "$zip_file"
            test -f "${zip_file}.sha256"
            test -f "${zip_file}.sig"
            openssl dgst -sha256 -verify publisher-key.pem -signature "${zip_file}.sig" "$zip_file"
          done
          sha256sum numera-emoji-mapper-*.zip > SHA256SUMS
          openssl dgst -sha256 -sign "$key" -out SHA256SUMS.sig SHA256SUMS
          openssl dgst -sha256 -verify publisher-key.pem -signature SHA256SUMS.sig SHA256SUMS
      - name: Attest build provenance for release archives
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.zip
            dist/*.sig
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
      - name: Attach verified signed packages to the versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 dist/*.zip.sig dist/SHA256SUMS dist/SHA256SUMS.sig dist/publisher-cert.pem dist/publisher-key.pem --clobber --repo "$GITHUB_REPOSITORY"
