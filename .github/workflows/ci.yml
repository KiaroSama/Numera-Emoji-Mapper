name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

# Every push and pull request is checked; a superseded run stops on the same ref.
concurrency:
  group: ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# Jobs use ephemeral GitHub-HOSTED Ubuntu/Windows runners. This account's hosted
# minutes are blocked for PRIVATE repositories, which is why CI used to run on
# a self-hosted WSL runner; hosted minutes are free for PUBLIC ones, so the
# block stopped applying when this repository was published.
#
# A self-hosted runner must NEVER be registered and selected on a public
# repository: a public repo accepts pull requests from anyone, and a fork's
# workflow would then execute a stranger's code on the owner's own machine.
# The runner was deregistered before publication, and that order is the safety
# property, not a detail.
#
# Consequences of hosted runners to respect, all the opposite of the old box:
# every job starts from a FRESH machine, so nothing may assume state survives
# between jobs; passwordless sudo IS available, so a job installs the system
# packages it needs rather than relying on a global setup; and the machines are
# small (2 cores), so the timeouts below are ceilings sized for that, not
# expectations.

jobs:
  native-build:
    name: Rust build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: windows-2025
            platform: windows-x64
          - os: macos-15-intel
            platform: macos-x64
          - os: macos-15
            platform: macos-arm64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.9"
      - name: Select Rust compiler
        run: rustup default 1.99.0
      - name: Build release executables
        env:
          PYO3_PYTHON: python
        run: cargo build --manifest-path native/Cargo.toml --locked --release --bins
      - name: Compile every Rust test target
        env:
          PYO3_PYTHON: python
        run: cargo test --manifest-path native/Cargo.toml --locked --no-run
      - name: Upload compiled executables
        uses: actions/upload-artifact@v7
        with:
          name: rust-build-${{ matrix.platform }}
          path: |
            native/target/release/numera-emoji
            native/target/release/numera-emoji.exe
            native/target/release/numera-build
            native/target/release/numera-build.exe
          if-no-files-found: error

  # The Worker is TypeScript with its own vitest suite. Its own job rather than
  # a step in `build`: it shares nothing with the Python matrix, needs Node
  # instead of Python + ffmpeg, and running it twice (once per Python version)
  # would be pure waste. A separate job also means a Worker failure is legible
  # as a Worker failure.
  worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      # `npm ci`, never `npm install`: it installs exactly the committed
      # lockfile and fails if package.json and the lock disagree, so CI cannot
      # quietly test a different dependency tree than the one committed.
      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      # The panel's classic scripts share one global scope and call each other
      # by name; nothing else notices a rename that breaks another file until a
      # browser runs that path. This job already has TypeScript installed.
      - name: Type-check the panel scripts
        run: npx tsc -p ../assets/jsconfig.json --noEmit

      # vitest stubs fetch, so nothing here can reach Telegram -- the same rule
      # the Python suite enforces with its hermetic guard, for the same reason:
      # a test once reached live Telegram and replaced a sticker in a published
      # pack. `--run` is explicit so a CI runner can never land in watch mode
      # and hang until the job timeout.
      - name: Unit tests (vitest)
        run: npx vitest run

      - name: Dependency advisories and offline packaging
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          npm audit --audit-level=high
          npx wrangler deploy --dry-run --outdir .wrangler/dry-run

  # The panel's browser suite drives the real page in headless Chromium. Its own
  # job for the same reason as the Worker's: it tests JavaScript, so running it
  # once per Python version would download Chromium twice to prove the same
  # thing. The `build` matrix therefore opts out of it explicitly -- the module
  # is a hard error, never a silent skip, when the browser is missing, so the
  # opt-out has to be stated somewhere rather than left to chance.
  panel-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
      CARGO_BUILD_JOBS: "2"
      HOOKMAKER_MAX_TEST_WORKERS: "2"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Select supported Rust toolchain
        run: rustup default 1.99.0

      - name: Build required Rust computation module
        run: python scripts/build_native.py

      - name: Build native backend executable for command parity
        env:
          PYO3_PYTHON: python
          CARGO_BUILD_JOBS: "2"
        run: cargo build --manifest-path native/Cargo.toml --locked --bin numera-emoji

      # `--with-deps` runs apt-get under sudo to install Chromium's system
      # libraries. It was forbidden on the old self-hosted runner, which had no
      # passwordless sudo and would have sat on a password prompt until the job
      # timeout; a hosted runner has it, and starts from a bare machine where
      # those libraries are genuinely absent.
      # ~150 MB per run otherwise. Keyed on the pinned playwright version, so a
      # bump downloads the matching browser once. `install --with-deps` still
      # runs: it installs the system libraries and is fast on a cache hit.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: .cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements-dev.txt') }}

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      # Named explicitly rather than globbed: `test_panel_*` would also match
      # the five panel suites the build matrix already runs, and running a test
      # in two jobs is worse than running it in one. `tests.` is the package
      # path, so tests/__init__.py still executes -- that file is the credential
      # scrub and the non-loopback socket block, and it is not optional.
      #
      # tests/test_ci_coverage.py fails if a browser suite exists on disk and is
      # missing from this line.
      - name: Panel browser tests
        run: python -m unittest tests.test_panel_browser tests.test_panel_queues tests.test_panel_curation tests.test_panel_perf -v

      # Rust owns the driver/catalog and typed external Playwright calls. The
      # existing test runner owns driver/browser descendants (900s wall/180s idle).
      - name: Permit private test namespaces
        uses: ./.github/actions/test-network

      - name: Native panel browser tests
        env:
          PYO3_PYTHON: python
        run: native/target/debug/numera-emoji test-cargo --baseline 1a36a968b006236bd0665a1da65c541938c06061 -- --config .cargo/tests.toml --manifest-path native/Cargo.toml --locked --test panel_browser -- --test-threads=1 --nocapture

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # The panel's browser suite has its own job above. Opting out here is
    # deliberate and must stay explicit: test_panel_browser.py raises rather
    # than skipping when playwright or Chromium is missing, because a browser
    # test that reports green on a machine with no browser is worse than none.
    env:
      NUMERA_EMOJI_MAPPER_NO_BROWSER_TESTS: "1"
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the runtime run.ps1 / .venv target; 3.12 guards against the
        # old reportlab-era assumption that newer Pythons are unsupported --
        # every dependency ships wheels for all three. 3.14 is the newest stable
        # release, so an incompatibility with it shows up here first.
        python-version: ["3.11", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          # Only the source-oracle lane pins the historical patch; other lanes remain current.
          python-version: ${{ matrix.python-version == '3.11' && '3.11.9' || matrix.python-version }}
          cache: pip

      # Both manifests: the core one, plus the coin extra (numpy). Not optional
      # here -- tests/test_entry_points.py imports EVERY discovered entry point,
      # and coins/remap_ids.py imports numpy at module level.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-coins.txt -r requirements-dev.txt

      - name: Select supported Rust toolchain
        run: rustup default 1.99.0

      - name: Build required Rust computation module
        run: python scripts/build_native.py

      - name: Build native backend executable for command parity
        env:
          PYO3_PYTHON: python
          CARGO_BUILD_JOBS: "2"
        run: cargo build --manifest-path native/Cargo.toml --locked --lib --bin numera-emoji --bin numera-build

      # INSTALLED here, not merely checked: a hosted runner is a fresh machine
      # with no ffmpeg, where the old self-hosted box had it in its global
      # setup. The `command -v` check afterwards is the load-bearing half --
      # apt can answer a mirror outage by installing nothing and still exiting
      # 0, and the failure then surfaces three steps later as an application
      # error that names the wrong component.
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            echo "::error::ffmpeg/ffprobe did not resolve after apt-get reported success."
            exit 1
          fi
          ffmpeg -version | head -1

      # Byte-compile + the full suite, through the same script a developer runs,
      # so CI and local runs cannot drift into different invocations. The script
      # owns the `-t .` form, which is REQUIRED, not cosmetic: without it the
      # tests directory becomes the top level, modules load as `test_x` instead
      # of `tests.test_x`, and tests/__init__.py -- which scrubs credentials and
      # blocks the network -- never runs. tests.test_entry_points.SuiteIsHermetic
      # fails loudly if the suite is ever started without it.
      - name: Project checks (compile + lint + unit and entry-point tests)
        shell: pwsh
        run: |
          ./scripts/check.ps1
          exit $LASTEXITCODE

      - name: Install Rust check components
        if: matrix.python-version == '3.11'
        run: rustup component add rustfmt clippy

      - name: Permit private test namespaces
        if: matrix.python-version == '3.11'
        uses: ./.github/actions/test-network

      - name: Rust format, lint and unit checks
        if: matrix.python-version == '3.11'
        env:
          PYO3_PYTHON: python
          CARGO_BUILD_JOBS: "2"
        run: |
          cargo fmt --manifest-path native/Cargo.toml --check
          cargo clippy --manifest-path native/Cargo.toml --locked --all-targets -- -D warnings
          native/target/debug/numera-emoji source-static-images --output-dir logs/checkpoint/static-images
          export NUMERA_STATIC_CONVERT_ORACLE="$PWD/logs/checkpoint/static-images/static-convert-source.json"
          export NUMERA_PROVIDER_IMAGE_ORACLE="$PWD/logs/checkpoint/static-images/provider-image-source.json"
          native/target/debug/numera-emoji source-lottie-render --output-dir logs/checkpoint/lottie-render
          export NUMERA_LOTTIE_PREVIEW_ORACLE="$PWD/logs/checkpoint/lottie-render/lottie-preview-source.json"
          export NUMERA_GALLERY_CODEC_ORACLE="$PWD/logs/checkpoint/lottie-render/gallery-codec-source.json"
          rustc --edition=2024 native/tests/fixtures/media_worker.rs -o "$PWD/logs/checkpoint/media-worker-fixture"
          export NUMERA_MEDIA_FIXTURE_WORKER="$PWD/logs/checkpoint/media-worker-fixture"
          native/target/debug/numera-emoji test-cargo --baseline 1a36a968b006236bd0665a1da65c541938c06061 -- --config .cargo/tests.toml --manifest-path native/Cargo.toml --locked --no-fail-fast -- --test-threads=1

      - name: Similarity benchmark and parity
        if: matrix.python-version == '3.11'
        run: native/target/debug/numera-emoji benchmark-similarity

      - name: build_pack dry-run (no network)
        run: |
          python - <<'PY'
          import tests
          import os, subprocess, sys, tempfile
          from pathlib import Path
          from PIL import Image
          Path("logs").mkdir(exist_ok=True)
          with tempfile.TemporaryDirectory(prefix="ci-smoke-", dir="logs") as folder:
              Image.new("RGBA", (100, 100), (0, 128, 255, 255)).save(Path(folder) / "a.png")
              os.environ["GENERAL_BOT_TOKEN"] = "dummy"
              r = subprocess.run([str(Path("native/target/debug/numera-emoji").resolve()), "build-pack", "--base", "ci",
                                  "--title", "CI", "--user-id", "1",
                                  "--source-dir", folder,
                                  "--token-env", "GENERAL_BOT_TOKEN", "--dry-run"],
                                 timeout=30, stdin=subprocess.DEVNULL)
          sys.exit(r.returncode)
          PY

  # Native Windows ownership and restore are not exercised by Linux or WSL.
  # Keep this on an ephemeral hosted runner; never restore the public repo's
  # former self-hosted runner merely to obtain Windows coverage.
  windows-safety:
    runs-on: windows-latest
    # Cold native builds precede all three retained acceptance buckets. Their
    # own Cargo/suite watchdogs stay bounded independently of this job ceiling.
    timeout-minutes: 90
    env:
      NUMERA_EMOJI_MAPPER_NO_BROWSER_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # run.ps1 and the other scripts are never executed in CI, so a syntax
      # error would ship unnoticed. Parse every tracked one; fail on any error.
      - name: Every PowerShell script parses
        shell: pwsh
        run: |
          $bad = git ls-files '*.ps1' | ForEach-Object {
            $e = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $_), [ref]$null, [ref]$e)
            if ($e) { "$_"; $e }
          }
          if ($bad) { $bad; exit 1 }
      - uses: actions/setup-python@v7
        with:
          # Native/source lock interoperability replays the exact historical runtime.
          python-version: "3.11.9"
          cache: pip
      - name: Install isolated test dependencies
        run: python -m pip install -r requirements.txt -r requirements-coins.txt -r requirements-dev.txt
      - name: Select supported Rust toolchain
        run: rustup default 1.99.0

      - name: Build required Rust computation module
        run: python scripts/build_native.py

      - name: Build native backend executable for command parity
        env:
          PYO3_PYTHON: python
          CARGO_BUILD_JOBS: "2"
        run: cargo build --manifest-path native/Cargo.toml --locked --lib --bin numera-emoji --bin numera-build
      - name: Require native Windows and FFmpeg
        shell: pwsh
        run: |
          python -c "import os; assert os.name == 'nt'"
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $env:PATH = [Environment]::GetEnvironmentVariable('PATH','Machine') + ';' + $env:PATH
          }
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue) -or -not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            throw 'ffmpeg and ffprobe are required for native Windows regressions'
          }
      - name: Build native Windows lifecycle fixture
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force logs/checkpoint, logs/tmp | Out-Null
          $fixture = Join-Path $PWD 'logs/checkpoint/media-worker-fixture.exe'
          rustc --edition=2024 native/tests/fixtures/media_worker.rs -o $fixture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "NUMERA_MEDIA_FIXTURE_WORKER=$fixture" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      # The running driver must not lock the executable Cargo is about to rebuild.
      - name: Copy native Cargo observation driver
        id: native-cargo-driver
        shell: pwsh
        run: |
          $driver = Join-Path $PWD 'logs/checkpoint/test-cargo-driver.exe'
          if (Test-Path -LiteralPath $driver) { throw 'Cargo observation driver already exists' }
          Copy-Item -LiteralPath native/target/debug/numera-emoji.exe -Destination $driver -ErrorAction Stop
      # Run this command early so filesystem/launcher failures are visible
      # before compiling the complete Windows acceptance cohort.
      - name: Native Windows archive regression
        env:
          PYO3_PYTHON: python
          CARGO_BUILD_JOBS: "2"
        run: logs/checkpoint/test-cargo-driver.exe test-cargo --baseline 1a36a968b006236bd0665a1da65c541938c06061 -- --config .cargo/tests.toml --manifest-path native/Cargo.toml --locked --test archive_commands -- --test-threads=1
      - name: Native codec lifecycle regressions
        if: ${{ !cancelled() && steps.native-cargo-driver.outcome == 'success' }}
        env:
          PYO3_PYTHON: python
          CARGO_BUILD_JOBS: "2"
        run: logs/checkpoint/test-cargo-driver.exe test-cargo --baseline 1a36a968b006236bd0665a1da65c541938c06061 -- --config .cargo/tests.toml --manifest-path native/Cargo.toml --locked --no-fail-fast --test tooling_process --test tooling_test_runner --test tooling_runtime --test tooling_doctor --test tooling_menu --test tooling_launch --test tooling_sandbox --test tooling_build --test tooling_install --test tooling_policy --test wheel_package --test catalog_integrity --test catalog_paths --test pack_locks --test source_git_inventory --test source_assertions --test source_state_compat_recipe --test source_logging_admission --test logging_parity --test tooling_sandbox_serve --test tooling_convert_cli --test state_compat_parity --test ingest_parity --test telegram_transport --test bot_commands --test announce_binding --test process_session --test codec_prepare_tint --test codec_static --test codec_format --test codec_static_source_boundary --test codec_static_lifetime --test codec_svg_lifetime --test codec_lottie_file --test codec_reencode --test codec_compare --test codec_video_operations --test codec_process_policy --test codec_video --test codec_video_fidelity --test codec_lottie_lifetime --test codec_lottie_prepare --test repaint_gate --test source_fake_contracts --test source_reference_behavior --test source_lock_order --test codec_worker_error_ipc --test media_native_lifecycle --test media_native_consumers --test media_native_paths --test media_native_identity --test media_native_convert --test media_native_collect --test media_native_ids --test fetch_ids_cli --test coin_audit --test coin_audit_cli --test coin_keywords --test coin_provider_cli --test coin_http --test coin_provider_wire --test coin_gecko_fetch --test coin_provider_image --test coin_provider_effects --test coin_provider_restart --test coin_state --test coin_provider_cache --test coin_inventory --test coin_map_cli --test coin_remap_cli --test coin_remap_cache --test coin_remap_math --test coin_remap --test coin_verify_cli --test coin_replace_effects --test coin_replace_proof --test coin_logo_distance --test coin_rebuild_effects --test coin_rebuild_add_cli --test coin_plan_disk --test coin_plan --test coin_rebuild_map_cli --test coin_rebuild_recovery_disk --test coin_rebuild_links_cli --test process_lifecycle --test publication_recovery --test publication_unknown --test reconcile_view_parity --test reconcile_commit --test reconcile_identity --test publication_scratch --test operator_config --test sync_order --test archive_state --test archive_commands --test plan_removal --test plan_steps_parity --test pack_export --test status --test roster_state --test roster_commands --test pack_reports --test ticker_keywords --test emoji_ids --test gallery_parity --test roster_pack_parity --test archive_parity --test ownership --test state_artifacts --test atomic_failure --test sqlite_snapshot --test migration_database --test migration_signature --test migration_bundle --test panel_http --test panel_branding --test browser_open --test sandbox_lease_windows --test preview_warm --test preview_cancel --test local_format --test media_store --test media_config -- --test-threads=1

      - name: Native process-death migration replay
        if: ${{ !cancelled() && steps.native-cargo-driver.outcome == 'success' }}
        env:
          PYO3_PYTHON: python
          CARGO_BUILD_JOBS: "2"
        run: logs/checkpoint/test-cargo-driver.exe test-cargo --baseline 1a36a968b006236bd0665a1da65c541938c06061 -- --config .cargo/tests.toml --manifest-path native/Cargo.toml --locked --lib -- --test-threads=1

      - name: Native lock, migration, HTTP persistence, identity and CLI regressions
        if: ${{ !cancelled() && steps.native-cargo-driver.outcome == 'success' }}
        env:
          PYO3_PYTHON: python
        run: >-
          python -m unittest
          tests.test_pack_locks tests.test_pack_locks_exclusion
          tests.test_migration_lifecycle tests.test_migration_provenance
          tests.test_state_artifacts tests.test_sqlite_snapshot
          tests.test_panel_intent_persistence tests.test_video_collision_ingest
          tests.test_entry_point_contracts tests.test_panel_sandbox
          tests.test_sandbox_lifecycle tests.test_atomic_state_files
          tests.test_media_paths tests.test_media_bounds tests.test_native_similarity
          tests.test_native_state tests.test_native_catalog tests.test_native_real_catalog tests.test_native_command_help tests.test_native_package tests.test_native_consumer_boundary tests.test_native_install tests.test_launcher_contract tests.test_cli_docs tests.test_build_process_owner tests.test_media_boundary
          tests.test_native_storage_recovery tests.test_native_plan_steps
          tests.test_native_telegram tests.test_native_telegram_compat tests.test_native_announce_compat tests.test_native_state_compat tests.test_native_panel tests.test_native_ingest
          tests.test_native_reconcile tests.test_native_local_cli tests.test_native_fetch_cli tests.test_native_collect_partial
          tests.test_native_publish_cli tests.test_native_publication tests.test_native_video_visibility tests.test_native_bot
          tests.test_native_bot_poll tests.test_native_preview_codec tests.test_native_plan_cli tests.test_native_plan_status_cli tests.test_native_convert_cli tests.test_native_remove_cli
          tests.test_native_roster tests.test_native_roster_cli tests.test_native_archive_cli tests.test_native_export_cli tests.test_native_status_cli tests.test_native_ticker_cli tests.test_native_identity_cli tests.test_native_migration_cli tests.test_native_ids_cli tests.test_native_reorder_cli -v

      - name: Retain native Cargo failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-native-failure-diagnostics
          path: |
            logs/tmp/test-cargo-*/build.log
            logs/tmp/test-cargo-*/stderr.log
            logs/test-observations/**/results.log
          if-no-files-found: ignore
          retention-days: 7
