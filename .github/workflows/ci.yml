name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_acceptance:
        description: Run the full suite as a required signing and release dependency.
        type: boolean
        default: false

permissions:
  contents: read

env:
  NUMERA_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

concurrency:
  group: ci-${{ inputs.release_acceptance && 'release' || 'standalone' }}-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  native-build:
    name: Rust build and tests (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    # Cold release compilation includes every test crate on the Windows host.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
            triple: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            triple: aarch64-unknown-linux-gnu
          - os: windows-2025
            platform: windows-x64
            triple: x86_64-pc-windows-msvc
          - os: windows-11-arm
            platform: windows-arm64
            triple: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record and verify tested source revision
        shell: bash
        run: |
          mkdir -p logs/checkpoint
          git rev-parse HEAD > logs/checkpoint/source-revision.log
          test "$(cat logs/checkpoint/source-revision.log)" = "$NUMERA_SOURCE_REVISION"
      - name: Select Rust compiler
        shell: bash
        run: |
          rustup default 1.100.1
          rustup component add rustfmt clippy --toolchain 1.100.1
      - name: Assert Rust host matches target platform
        shell: bash
        run: |
          host="$(rustc -vV | awk '/^host: / {print $2}')"
          echo "Detected Rust host: $host (expected ${{ matrix.triple }})"
          test "$host" = "${{ matrix.triple }}"
      - name: Retain the immutable migration provenance source
        shell: bash
        env:
          NUMERA_MIGRATION_REFERENCE: a39a049c02f8dcc90d18fe8771869f82dd655221
        run: |
          if ! git cat-file -e "$NUMERA_MIGRATION_REFERENCE^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 https://github.com/KiaroSama/Numera-Emoji-Mapper.git "$NUMERA_MIGRATION_REFERENCE"
          fi
          git cat-file -e "$NUMERA_MIGRATION_REFERENCE^{commit}"
      - name: Cache Cargo dependency downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('runtime/Cargo.lock', 'tools/ci/Cargo.lock', 'tools/test-inventory/Cargo.lock') }}
          restore-keys: |
            cargo-downloads-${{ runner.os }}-${{ runner.arch }}-
      - name: Build standalone release executables
        id: runtime-build
        run: cargo build --manifest-path runtime/Cargo.toml --locked --release --bins
      - name: Verify embedded logo and target architecture on built binaries
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then suffix=.exe; else suffix=; fi
          for bin in numera-emoji numera-dev numera-runtime-tests numera-worker-admin; do
            "runtime/target/release/numera-emoji$suffix" verify-binary \
              --executable "runtime/target/release/${bin}${suffix}" \
              --target "${{ matrix.platform }}" \
              --logo assets/numera-emoji-mapper-logo-circle.png
          done
      - name: Verify Windows binary version metadata
        if: runner.os == 'Windows'
        uses: ./.github/actions/windows-binary-versions
      - name: Exercise the single-executable Windows version gate
        if: runner.os == 'Windows'
        uses: ./.github/actions/windows-binary-versions
        with:
          executable-path: runtime/target/release/numera-emoji.exe
      - name: Set up Node for Windows launcher contracts
        if: runner.os == 'Windows'
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Windows source launcher process contracts
        if: runner.os == 'Windows'
        run: node --test assets/tests/launcher-process.js
      - name: Rust format and lint
        shell: bash
        run: |
          cargo fmt --manifest-path runtime/Cargo.toml --check
          cargo clippy --manifest-path runtime/Cargo.toml --locked --all-targets -- -D warnings
      - name: Install Linux video prerequisites
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.cache/apt/archives/partial" "$GITHUB_WORKSPACE/.cache/apt/lists/partial"
          sudo apt-get -o Dir::State::lists="$GITHUB_WORKSPACE/.cache/apt/lists" update
          sudo apt-get -o Dir::State::lists="$GITHUB_WORKSPACE/.cache/apt/lists" -o Dir::Cache::archives="$GITHUB_WORKSPACE/.cache/apt/archives" install -y --no-install-recommends ffmpeg
      - name: Install Windows video prerequisites
        if: runner.os == 'Windows'
        uses: ./.github/actions/windows-video-tools
        timeout-minutes: 8
      - name: Require actual video tools
        shell: bash
        run: |
          ffmpeg -version
          ffprobe -version
      - name: Permit private test namespaces
        if: runner.os == 'Linux'
        uses: ./.github/actions/test-network
      - name: Verify original test identities and inventory tooling
        shell: bash
        run: |
          cargo fmt --manifest-path tools/test-inventory/Cargo.toml --check
          cargo clippy --manifest-path tools/test-inventory/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --config tests/runtime-tests.toml --manifest-path tools/test-inventory/Cargo.toml --locked
          cargo run --manifest-path tools/test-inventory/Cargo.toml --locked -- --mode rust
          cargo run --manifest-path tools/test-inventory/Cargo.toml --locked -- --mode language --output logs/checkpoint/language-policy.json
      - name: Installed Windows npm discovery regression
        if: runner.os == 'Windows'
        env:
          CARGO_TARGET_DIR: runtime/target/ci-tests
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        shell: bash
        run: |
          cargo test --config tests/runtime-tests.toml --manifest-path runtime/Cargo.toml --locked --release \
            --lib standard_windows_node_installation_enables_all_installed_web_checks \
            -- --test-threads=1 2>&1 | tee logs/checkpoint/windows-npm-regression.log
      - name: Publication, archive, panel, media, CLI and package boundary regressions
        # Surface critical boundary failures before compiling every test target.
        # The complete unfiltered acceptance step below remains mandatory.
        env:
          CARGO_TARGET_DIR: runtime/target/ci-tests
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        shell: bash
        run: |
          cargo test --config tests/runtime-tests.toml --manifest-path runtime/Cargo.toml --locked --release --no-fail-fast \
            --test supplemental_publication_admission --test supplemental_archive_branding \
            --test supplemental_panel_http --test supplemental_bot_resolution \
            --test supplemental_binary_artifact --test supplemental_local_inputs \
            --test supplemental_binary_version \
            --test baseline_tooling --test supplemental_tooling \
            --test baseline_recovery \
            -- --test-threads=1 2>&1 | tee logs/checkpoint/boundary-regressions.log
      - name: Bounded process ownership regressions
        # Exercise strict inventory, deadline and real Windows handle contracts
        # before the full suite, without changing its admission or timeout policy.
        env:
          CARGO_TARGET_DIR: runtime/target/ci-tests
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        shell: bash
        run: |
          cargo test --config tests/runtime-tests.toml --manifest-path runtime/Cargo.toml --locked --release \
            --lib process_owner:: -- --test-threads=1 2>&1 | tee logs/checkpoint/process-ownership-regressions.log
      - name: All Rust tests through the isolated runner
        # Preserve optimized distribution binaries while avoiding LTO for each
        # test executable. Release cfg, assertions and test discovery stay the same.
        env:
          CARGO_TARGET_DIR: runtime/target/ci-tests
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        shell: bash
        run: |
          mkdir -p logs/checkpoint
          cargo test --config tests/runtime-tests.toml --manifest-path runtime/Cargo.toml --locked --release --no-fail-fast -- --test-threads=1 2>&1 | tee logs/checkpoint/runtime-tests.log
      - name: Similarity benchmark and parity
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then suffix=.exe; else suffix=; fi
          "runtime/target/release/numera-dev$suffix" benchmark-similarity --count 1500 --seed 321 --repeats 5
      - name: Upload standalone executables
        if: ${{ always() && steps.runtime-build.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: rust-build-${{ matrix.platform }}
          path: |
            runtime/target/release/numera-emoji
            runtime/target/release/numera-emoji.exe
            runtime/target/release/numera-dev
            runtime/target/release/numera-dev.exe
            runtime/target/release/numera-runtime-tests
            runtime/target/release/numera-runtime-tests.exe
            runtime/target/release/numera-worker-admin
            runtime/target/release/numera-worker-admin.exe
          if-no-files-found: error
      - name: Preserve CI diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-diagnostics-${{ matrix.platform }}
          path: |
            logs/**/*.log
            logs/tmp/runtime-tests-*/stdout
            logs/tmp/runtime-tests-*/stderr
            logs/tmp/baseline-catalog-baseline_recovery_baseline_catalog_support-*/*.jsonl
          if-no-files-found: warn
          retention-days: 7

  worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record and verify tested source revision
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p logs/checkpoint
          git rev-parse HEAD > logs/checkpoint/source-revision.log
          test "$(cat logs/checkpoint/source-revision.log)" = "$NUMERA_SOURCE_REVISION"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      # `npm ci`, never `npm install`: it installs exactly the committed
      # lockfile and fails if package.json and the lock disagree, so CI cannot
      # quietly test a different dependency tree than the one committed.
      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      # The panel's classic scripts share one global scope and call each other
      # by name; nothing else notices a rename that breaks another file until a
      # browser runs that path. This job already has TypeScript installed.
      - name: Type-check the panel scripts
        run: npx tsc -p ../assets/jsconfig.json --noEmit

      # Worker requests are intercepted by the existing Vitest fixtures.
      - name: Unit tests (vitest)
        run: npx vitest run

      - name: Dependency advisories and offline packaging
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          npm audit --audit-level=high
          npx wrangler deploy --dry-run --outdir .wrangler/dry-run

      - name: Preserve CI diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worker-diagnostics
          path: |
            logs/**/*.log
            logs/tmp/runtime-tests-*/stdout
            logs/tmp/runtime-tests-*/stderr
          if-no-files-found: warn
          retention-days: 7

  panel-browser:
    name: Panel browser and source contracts
    needs: native-build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: assets
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record and verify tested source revision
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p logs/checkpoint
          git rev-parse HEAD > logs/checkpoint/source-revision.log
          test "$(cat logs/checkpoint/source-revision.log)" = "$NUMERA_SOURCE_REVISION"
      - uses: actions/download-artifact@v8
        with:
          name: rust-build-linux-x64
          path: runtime/target/release
      - name: Restore native executable permission
        working-directory: ${{ github.workspace }}
        run: chmod +x runtime/target/release/numera-emoji
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: assets/package-lock.json
      - name: Install locked browser tooling
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Record actual browser test discovery
        run: npx playwright test --list --reporter=json > ../logs/checkpoint/browser-inventory.json
      - name: Verify actual browser and source-contract identities
        working-directory: ${{ github.workspace }}
        run: |
          rustup default 1.100.1
          cargo run --manifest-path tools/test-inventory/Cargo.toml --locked -- --mode all --playwright-list logs/checkpoint/browser-inventory.json
      - name: Panel browser tests
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/logs/checkpoint/browser-results.json
        run: npm test -- --reporter=line,json
      - name: Preserve browser diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: panel-browser-diagnostics
          path: |
            logs/**/*.log
            logs/checkpoint/browser-*.json
            logs/tmp/browser/**
          if-no-files-found: warn
          retention-days: 7

  powershell-7-3-compat:
    name: PowerShell 7.3.12 launcher compatibility (Linux x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify tested source revision
        run: test "$(git rev-parse HEAD)" = "$NUMERA_SOURCE_REVISION"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Select Rust compiler for the launcher fixture
        run: rustup default 1.100.1
      # This exercises the legacy PowerShell host on Linux, not Windows desktop behavior.
      - name: Verify PowerShell archive and run launcher contracts
        shell: bash
        run: |
          temp_dir="$(mktemp -d "$RUNNER_TEMP/numera-pwsh.XXXXXX")"
          trap 'rm -rf -- "$temp_dir"' EXIT
          archive="$temp_dir/powershell-7.3.12-linux-x64.tar.gz"
          curl --fail --silent --show-error --location --max-time 120 \
            --output "$archive" \
            https://github.com/PowerShell/PowerShell/releases/download/v7.3.12/powershell-7.3.12-linux-x64.tar.gz
          printf '%s  %s\n' '34d2ed497f11d3c160a6a20abd635686458d7c5173fede7ad354bd73327fe89b' "$archive" | sha256sum --check
          mkdir "$temp_dir/pwsh"
          tar -xzf "$archive" -C "$temp_dir/pwsh"
          export NUMERA_TEST_PWSH="$temp_dir/pwsh/pwsh"
          chmod +x "$NUMERA_TEST_PWSH"
          test "$("$NUMERA_TEST_PWSH" -NoLogo -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion.ToString()')" = '7.3.12'
          node --test assets/tests/launcher-process.js
