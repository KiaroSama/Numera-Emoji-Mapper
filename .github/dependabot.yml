version: 2
updates:
  # Standalone application and Rust contributor tools.
  - package-ecosystem: "cargo"
    directories:
      - "/runtime"
      - "/tools/ci"
      - "/tools/test-inventory"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  # Browser acceptance has its own locked npm tree.
  - package-ecosystem: "npm"
    directory: "/assets"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  # The Worker's npm tree is independent of browser tooling.
  - package-ecosystem: "npm"
    directory: "/worker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "worker"

  # GitHub Actions used in workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
